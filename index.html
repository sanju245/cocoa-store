<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocoa Luxury</title>
<meta name="description" content="T-shirts, shorts and watches. Order on WhatsApp or pay online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .wrap { width: min(1180px, 100% - 2.5rem); margin-inline: auto; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    background: rgba(21, 15, 11, 0.93); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
  .brand { font-family: var(--display); font-size: 1.35rem; color: var(--gold-hi); text-decoration: none; }
  .bag-btn { min-height: 42px; padding: 0.35rem 1.1rem; }
  .bag-btn span { min-width: 1.4em; text-align: center; color: var(--gold-ink); background: var(--gold); border-radius: 999px; font-size: 0.85rem; }

  .hero { padding: clamp(3.5rem, 10vw, 8rem) 0 clamp(3rem, 7vw, 5.5rem); border-bottom: 1px solid var(--line); }
  .wordmark {
    font-size: clamp(3.2rem, 12vw, 8.5rem); font-weight: 500; letter-spacing: -0.02em; line-height: 1;
    background: linear-gradient(100deg, #8f6f2f 0%, #e8cd90 32%, #c8a45c 52%, #f4e2b4 74%, #a9863c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-bottom: 0.08em;
  }
  .hero p { max-width: 30ch; font-size: 1.3rem; font-weight: 300; color: var(--muted); margin: 1.5rem 0 2.2rem; }

  .filters { display: flex; gap: 0.6rem; flex-wrap: wrap; padding: 2.2rem 0 1.6rem; }
  .chip { min-height: 42px; padding: 0.4rem 1.2rem; border: 1px solid var(--line); background: transparent; border-radius: 999px; color: var(--muted); }
  .chip:hover { border-color: var(--line-strong); color: var(--gold-hi); }
  .chip[aria-pressed='true'] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.6rem 0.9rem; padding-bottom: 4.5rem; }
  @media (min-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 2.4rem 1.5rem; } }
  @media (min-width: 1040px) { .grid { grid-template-columns: repeat(4, 1fr); } }

  .card { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; }
  .card-img { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; background: var(--surface); border: 1px solid var(--line); transition: border-color 0.25s; }
  .card:hover .card-img { border-color: var(--gold); }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .tag { position: absolute; left: 0.6rem; top: 0.6rem; padding: 0.15rem 0.7rem; background: var(--bg); color: var(--gold-hi); border: 1px solid var(--line-strong); font-size: 0.82rem; }
  .card-name { display: block; margin-top: 0.85rem; font-family: var(--display); font-size: 1.15rem; line-height: 1.25; }
  .card-meta { display: flex; justify-content: space-between; gap: 0.5rem; margin-top: 0.25rem; color: var(--muted); font-size: 0.93rem; }
  .price { color: var(--gold-hi); font-weight: 500; }
  .empty { grid-column: 1 / -1; padding: 3rem 0; color: var(--muted); font-size: 1.1rem; }
  .notice { margin: 2rem 0; padding: 1rem 1.25rem; border: 1px solid var(--line-strong); color: var(--gold-hi); }

  footer { border-top: 1px solid var(--line); padding: 2.2rem 0 3rem; color: var(--muted); }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 0.6rem 2rem; justify-content: space-between; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--gold-hi); }

  /* Product dialog */
  #productDlg { width: min(940px, 94vw); max-height: 92dvh; }
  .x { position: absolute; top: 0.6rem; right: 0.6rem; z-index: 2; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-strong); background: rgba(21, 15, 11, 0.88); font-size: 1.3rem; line-height: 1; }
  .pd { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .pd { grid-template-columns: 1.05fr 1fr; } }
  .pd .main { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--surface-2); }
  .thumbs { display: flex; gap: 0.5rem; padding: 0.6rem; overflow-x: auto; }
  .thumbs button { flex: none; width: 60px; height: 75px; padding: 0; border: 1px solid var(--line); background: none; }
  .thumbs button[aria-current='true'] { border-color: var(--gold); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .pd-info { display: flex; flex-direction: column; gap: 1.1rem; padding: 2rem 1.5rem 1.6rem; }
  .pd-info h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); padding-right: 2.5rem; }
  .pd-price { font-size: 1.5rem; color: var(--gold-hi); }
  .pd-desc { color: var(--muted); white-space: pre-line; max-width: 52ch; }
  .sizes { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .size { min-width: 48px; min-height: 44px; padding: 0 0.9rem; border: 1px solid var(--line); background: none; }
  .size[aria-pressed='true'] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }

  /* Bag drawer */
  #cartDlg { margin: 0 0 0 auto; width: min(440px, 100vw); height: 100dvh; max-height: 100dvh; border-width: 0 0 0 1px; }
  #cartDlg[open] { animation: slide 0.28s ease-out; }
  @keyframes slide { from { transform: translateX(32px); opacity: 0; } }
  .cart-head { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--line); }
  .cart-head h2 { font-size: 1.5rem; }
  #cartBody { display: flex; flex-direction: column; padding: 1.25rem; min-height: calc(100dvh - 66px); }
  .lines { list-style: none; margin: 0; padding: 0; flex: 1; }
  .line { display: grid; grid-template-columns: 72px 1fr auto; gap: 0.9rem; padding: 1rem 0; border-bottom: 1px solid var(--line); }
  .line img { width: 72px; height: 90px; object-fit: cover; background: var(--surface-2); }
  .line-name { font-family: var(--display); font-size: 1.05rem; }
  .qty { display: inline-flex; align-items: center; margin-top: 0.55rem; border: 1px solid var(--line); }
  .qty button { width: 40px; height: 40px; border: 0; background: none; font-size: 1.1rem; }
  .qty span { min-width: 2rem; text-align: center; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin: 1.1rem 0; }
  .total strong { font-family: var(--display); font-size: 1.7rem; font-weight: 500; color: var(--gold-hi); }
  .stack { display: grid; gap: 0.7rem; }
  .cart-empty { display: grid; gap: 1.2rem; justify-items: start; padding-top: 1rem; color: var(--muted); }
  .done h3 { font-size: 1.9rem; margin: 0.6rem 0 0.8rem; }
  .done p { color: var(--muted); margin-bottom: 1.4rem; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#" id="brandName">Cocoa Luxury</a>
    <button class="btn bag-btn" id="openCart" type="button" aria-label="Open your bag">Bag <span id="cartCount">0</span></button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1 class="wordmark" id="heroName">Cocoa Luxury</h1>
      <p id="tagline">T-shirts, shorts and watches.</p>
      <a class="btn btn-gold" href="#shop">Shop the collection</a>
    </div>
  </section>

  <section id="shop" class="wrap">
    <div id="filters" class="filters" role="group" aria-label="Filter by category"></div>
    <div id="notice"></div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="copy">Cocoa Luxury</span>
    <span><a id="igLink" href="#" target="_blank" rel="noopener">Instagram</a></span>
  </div>
</footer>

<dialog id="productDlg" aria-label="Product details"></dialog>

<dialog id="cartDlg" aria-label="Your bag">
  <div class="cart-head">
    <h2>Your bag</h2>
    <button class="link" id="closeCart" type="button">Close</button>
  </div>
  <div id="cartBody"></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shop.js"></script>
</body>
</html>
